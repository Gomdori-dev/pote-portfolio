<!doctype html>
<!--
  Renders public/brand/pote-gallery-og-card.png (1200x630), the link-preview card for
  Instagram, Threads, KakaoTalk and Facebook. Replaces port-og-card.png after
  the English display brand went back to Pote Gallery (2026-09-24; Korean
  stays 포트 갤러리). Bilingual on purpose: English captions now link here for overseas readers.
  Render: chrome --headless=new --window-size=1200,630 --screenshot=... this file
-->
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap');
  html,body{margin:0}
  body{width:1200px;height:630px;background:#071c18;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif KR",Georgia,serif}
  .panel{box-sizing:border-box;width:1132px;height:562px;background:#0d2822;border:3px solid #985216;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .mark{display:flex;align-items:baseline;gap:18px}
  .port{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:150px;letter-spacing:-2px;line-height:1;
        background:linear-gradient(135deg,#f6ead9 0%,#eec9a8 24%,#f2b87d 50%,#ec9951 78%,#985216 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .gallery{font-family:Georgia,serif;font-size:48px;color:rgba(234,223,211,.78)}
  .rule{width:180px;height:1px;background:rgba(236,153,81,.35);margin:34px 0 26px}
  .ko{color:#eadfd3;font-size:38px;margin:0}
  .en{color:#c9b8a6;font-family:Georgia,serif;font-style:italic;font-size:28px;margin:14px 0 0}
  .url{color:#8d9a92;font-family:Arial,sans-serif;font-weight:700;letter-spacing:.2em;font-size:18px;margin:30px 0 0}
</style>
<div class="panel">
  <div class="mark"><span class="port">Pote</span><span class="gallery">Gallery</span></div>
  <div class="rule"></div>
  <p class="ko">포트 갤러리 · 신진 작가 원화</p>
  <p class="en">Original art by emerging Korean artists</p>
  <p class="url">POTEGALLERY.COM</p>
</div>
